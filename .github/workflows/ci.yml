name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test-matrix
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  test-required:
    name: test
    if: ${{ always() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test matrix job to pass
        if: ${{ needs.test.result != 'success' }}
        run: exit 1
      - run: echo "test matrix passed"

  self-sync:
    name: self-sync-matrix
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Self-sync (regenerates vendor mirrors from .agent/)
        run: node agentkit.mjs sync .
      - name: Drift check
        run: node agentkit.mjs check . --quick
      - name: Content integrity
        run: node agentkit.mjs check . --content

  self-sync-required:
    name: self-sync
    if: ${{ always() }}
    needs: [self-sync]
    runs-on: ubuntu-latest
    steps:
      - name: Require every self-sync matrix job to pass
        if: ${{ needs.self-sync.result != 'success' }}
        run: exit 1
      - run: echo "self-sync matrix passed"
