name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --no-audit --no-fund || npm ci --no-audit --no-fund
      - run: npm test

  self-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund || npm ci --no-audit --no-fund
      - name: Self-sync (regenerates vendor mirrors from .agent/)
        run: node agentkit.mjs sync .
      - name: Drift check
        run: node agentkit.mjs check . --quick