name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  self-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Self-sync (regenerates vendor mirrors from .agent/)
        run: node agentkit.mjs sync .
      - name: Drift check
        run: node agentkit.mjs check . --quick
      - name: Content integrity
        run: node agentkit.mjs check . --content
